name: CI/CD - Brixen CRM Pipeline

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Modular Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          CRM_TESTING: "1"
        run: python tests/run_all.py

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy to VPS (if VPS secrets configured)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Notice: VPS_HOST or VPS_SSH_KEY is not set in GitHub Secrets."
            echo "CI test suite passed successfully. Skipping remote SSH deploy step."
            exit 0
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

          SSH="ssh -i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22}"
          USER_NAME="${VPS_USER:-root}"

          $SSH "$USER_NAME@$VPS_HOST" "set -eu
            cd /var/www/brixen-crm
            git fetch origin
            git checkout development
            git pull origin development
            export DATABASE_HOST_PATH=/var/www/brixen-crm/hypetex.db
            export STORAGE_HOST_PATH=/var/www/brixen-crm/storage/clients
            docker-compose up -d --build || docker compose up -d --build
          "
